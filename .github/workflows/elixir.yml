name: Elixir CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - elixir: "1.18"
            otp: "27"
            req: "lock"
          - elixir: "1.18"
            otp: "28"
            req: "lock"
          # Oldest Req line the package allows. Req 0.6 re-runs the request
          # pipeline differently from 0.7, so both need coverage.
          - elixir: "1.18"
            otp: "28"
            req: "0.6"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Set up Python verifier stack
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python verifier dependency
        run: python -m pip install --upgrade pip "auth0-api-python==1.0.0b10"

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.req }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ matrix.req }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Pin Req 0.6
        if: matrix.req == '0.6'
        run: |
          sed -i 's/{:req, ">= 0.6.1 and < 1.0.0"}/{:req, "~> 0.6.3"}/' mix.exs
          mix deps.update req

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Credo
        run: mix credo --strict

      - name: Test
        run: mix test

      - name: Build docs
        run: mix docs

      - name: Build package
        run: mix hex.build
